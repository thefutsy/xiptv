name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write. A fork's pull request gets a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit && vite build, the same command the release job runs.
      - run: npm run build
